[project]
name = "mqtt-antena-mobile"
version = "0.1.0"
description = "Lightweight mobile MQTT client inspired by MQTT Antena"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MQTT Antena", email = "dev@example.com" }
]
dependencies = [
    "flet==1.0.4",
    "paho-mqtt>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "flet[test]==1.0.4",
    "flet-cli>=1.0.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[dependency-groups]
dev = [
    "flet[test]==1.0.4",
    "flet-cli>=1.0.4",
    "flet-desktop>=1.0.4",
    "flet-web>=1.0.4",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.flet]
org = "com.antena"
product = "mqtt-antena-mobile"
company = "MQTT Antena"
copyright = "Copyright (C) 2026 MQTT Antena"

[tool.flet.app]
path = "src"
